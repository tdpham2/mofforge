name: Reliability checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            extras: '--extra dev'
            name: core-minimum
          - python: '3.14'
            extras: '--extra dev'
            name: core-current
          - python: '3.14'
            extras: '--extra dev --extra chem'
            name: chemistry
          - python: '3.14'
            extras: '--extra dev --extra mcp'
            name: mcp
          - python: '3.11'
            extras: '--extra dev --extra build --extra mcp'
            name: builders
    name: ${{ matrix.name }} (Python ${{ matrix.python }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.18'
          enable-cache: true
      - run: uv sync --locked --python '${{ matrix.python }}' ${{ matrix.extras }}
      - run: uv run --no-sync ruff check src/ tests/ examples/
      - run: uv run --no-sync pytest tests/ --cov=mofforge --cov-report=term-missing --cov-report=xml
      - if: matrix.name == 'builders'
        run: uv run --no-sync pytest tests/test_build_integration.py tests/test_examples.py -m integration -v
        env:
          MOFFORGE_RUN_BUILD_TESTS: '1'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.name }}
          path: coverage.xml

  polymer-boxes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.18'
          enable-cache: true
      - run: uv sync --locked --extra dev --extra pop --extra mcp
      - run: uv pip install --python .venv/bin/python 'packmol==21.2.3'
      - name: Required native packing, connection, and interface evidence
        run: uv run --no-sync pytest tests/test_polymerize*.py --basetemp=/tmp/mofforge-pop-tests -v
        env:
          MOFFORGE_RUN_POP_TESTS: '1'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polymer-box-diagnostics
          path: /tmp/mofforge-pop-tests

  render-examples:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.18'
      - run: uv sync --locked --extra dev --extra vis
      - run: uv run --no-sync playwright install --with-deps chromium
      - run: uv run --no-sync pytest tests/test_examples.py -k png_rendering -v
        env:
          MOFFORGE_RUN_RENDER_TESTS: '1'

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.18'
      - run: uv build
      - run: uv venv /tmp/mofforge-wheel --python 3.11
      - run: uv export --locked --no-emit-project --no-dev --no-hashes -o /tmp/mofforge-constraints.txt
      - run: uv pip install --python /tmp/mofforge-wheel/bin/python --constraint /tmp/mofforge-constraints.txt dist/*.whl
      - run: /tmp/mofforge-wheel/bin/mofforge --help
      - name: Check packaged fragments and version away from source checkout
        working-directory: /tmp
        run: |
          /tmp/mofforge-wheel/bin/python - <<'PY'
          import mofforge
          from mofforge.data import moiety_path
          assert mofforge.__version__ == '0.2.0'
          assert moiety_path('2-!-p-phenylene.xyz').is_file()
          print(mofforge.__file__)
          PY
