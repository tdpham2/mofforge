[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mofforge"
version = "0.1.0"
description = "Build and modify atomistic crystal structure models, especially MOFs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "mofforge contributors"},
]
keywords = ["MOF", "crystal", "substructure", "find-replace", "materials", "construction", "topology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pymatgen",
    "networkx>=3.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "click>=8.0",
    "pyyaml>=6.0",
    # TOML config (stdlib tomllib requires Python 3.11+)
    "tomli>=1.0; python_version < '3.11'",
]

[project.optional-dependencies]
vis = [
    "playwright",
]
chem = [
    "rdkit",
]
build = [
    "pormake",
    # Importable ToBaCCo 3.0 (v3.1+ exposes tobacco3.generate_mof). The package
    # ships code only and does NOT bundle the topology / building-block data
    # directories (template_database/, nodes_database/, edges_database/).
    # mofforge resolves that data in order: an explicit MOFFORGE_TOBACCO_DATA
    # dir (or mofforge.toml path) -> auto-detection next to the installed
    # package -> a one-time download of the pinned data tarball from GitHub,
    # cached under ~/.cache/mofforge/tobacco-data (see mofforge.build.config).
    # The data is GPLv3 (ToBaCCo, (c) 2019 Ryther Anderson); it is fetched and
    # used at runtime only, so mofforge itself remains MIT.
    "tobacco3 @ git+https://github.com/tdpham2/tobacco_3.0.git",
]
mcp = [
    "mcp[cli]>=1.16,<2",
]
chemgraph = [
    # ChemGraph CGFastMCP HPC adapter (mofforge-mcp-chemgraph entry point).
    # The CGFastMCP class lives on the dev-globus-hpc branch; install from
    # source: pip install "chemgraph @ git+https://github.com/argonne-lcf/ChemGraph.git@dev-globus-hpc"
    "chemgraph",
]
all = [
    "mofforge[vis,chem,build,mcp]",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.scripts]
mofforge = "mofforge.cli:main"
mofforge-mcp = "mofforge.mcp.server:main"
mofforge-mcp-chemgraph = "mofforge.mcp.chemgraph_server:main"

# Required for the `tobacco3 @ git+https://...` direct URL dependency in the
# `build` optional-dependency group; hatchling rejects direct references otherwise.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mofforge"]
artifacts = ["src/mofforge/data/moieties/*.xyz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
ignore = [
    "UP007",   # X | Y union syntax (already used, but keep compat with older annotations)
    "SIM108",  # ternary operator (can reduce readability in scientific code)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # allow assert False in tests
